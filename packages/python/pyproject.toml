[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rootcast"
dynamic = ["version"]
description = "The flight recorder for AI agents. Find where an agent went wrong and why."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Amaresh Hebbar", email = "hebbar.gvamaresh@gmail.com" }]
maintainers = [{ name = "Amaresh Hebbar", email = "hebbar.gvamaresh@gmail.com" }]
keywords = ["ai", "agents", "debugging", "observability", "root cause", "replay", "llm", "tracing", "causal analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://github.com/amareshhebbar/RootCast"
Repository = "https://github.com/amareshhebbar/RootCast"
Issues = "https://github.com/amareshhebbar/RootCast/issues"
Documentation = "https://github.com/amareshhebbar/RootCast/tree/main/docs"
Changelog = "https://github.com/amareshhebbar/RootCast/blob/main/packages/python/CHANGELOG.md"

[project.scripts]
rootcast = "rootcast.cli:main"

[tool.hatch.version]
path = "src/rootcast/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rootcast"]

[tool.hatch.build.targets.sdist]
include = [
    "src/rootcast",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
