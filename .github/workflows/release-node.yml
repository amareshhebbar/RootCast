name: release-node

on:
  push:
    tags:
      - "node-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ../python
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "node-v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version $version (want node-v$version)"
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - run: node scripts/release_check.mjs

  publish:
    needs: check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm install --no-audit --no-fund
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify:
    needs: [check, publish]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: wait for the registry
        run: |
          for i in $(seq 1 20); do
            npm view "rootcast@${{ needs.check.outputs.version }}" version && exit 0
            sleep 15
          done
          exit 1
      - run: node scripts/release_check.mjs --from-registry
